<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B1916" />
      <stop offset="100%" stop-color="#0E0D0B" />
    </linearGradient>
    <linearGradient id="mGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#E05A36" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="20" y="20" width="472" height="472" rx="124" fill="url(#bg)" stroke="#38342E" stroke-width="12" filter="url(#softGlow)" />

  <!-- Inner subtle border -->
  <rect x="28" y="28" width="456" height="456" rx="116" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2" />

  <!-- Monogram text CM -->
  <g text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="224" letter-spacing="-8">
    <text x="256" y="332">
      <tspan fill="#F7F5F0">C</tspan><tspan fill="url(#mGrad)">M</tspan>
    </text>
  </g>

  <!-- Studio accent dot -->
  <circle cx="396" cy="350" r="15" fill="#E05A36" />
</svg>